name: Qodana
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main


jobs:
  qodana:
    name: Qodana
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}  # the PR commit, not the merge commit
          fetch-depth: 0                                                 # full history for PR analysis
      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: false
          args: --project-dir,apps/backend   # config: apps/backend/qodana.yaml
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1432713639 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
