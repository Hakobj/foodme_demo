# Config for the Python test suite: tests in tests-python/, page objects / API clients / helpers in clients/, pages/, support/.
[pytest]
testpaths = tests-python
pythonpath = .
addopts = -ra --import-mode=importlib
markers =
    unit: fast isolated tests of the suite's own helpers (no backend, no browser)
    integration: HTTP tests against the running backend (tests-python/integration)
    e2e: Playwright UI tests through the browser (tests-python/e2e)
    api: alias of integration (port of the JUnit/MockMvc suite)
    web: Playwright UI tests for the storefront (tests-python/e2e/web, port of apps/web/e2e)
    admin: Playwright UI tests for the back office (tests-python/e2e/admin, port of apps/admin/e2e)
