ticket: SCRUM-7
sut: https://foodme-hakobjulfayan.onrender.com/
sources:
  doc: agentic-workflows/functional-testing/runs/SCRUM-7/sources/SCRUM-7.jira.md   # verbatim snapshot of the SCRUM-7 Jira description; no docs/SCRUM-7-*.md or jira/SCRUM-7*.md exists
  jira: [SCRUM-7]
acs:
  - id: AC-1
    text: "On the checkout page, the customer can enter a promo code and press Apply."
    source: jira:SCRUM-7 (snapshot in sources.doc)
  - id: AC-2
    text: "A valid code reduces the subtotal by the code's percentage. The discount and the new total are shown before the order is placed."
    source: jira:SCRUM-7 (snapshot in sources.doc)
  - id: AC-3
    text: "A code works only if the subtotal is at least the code's minimum order amount. Otherwise the page shows \"Add {missing amount} AMD more to use this code\"."
    source: jira:SCRUM-7 (snapshot in sources.doc)
  - id: AC-4
    text: "An expired code shows \"This code has expired\"."
    source: jira:SCRUM-7 (snapshot in sources.doc)
  - id: AC-5
    text: "An unknown code shows \"Code not found\"."
    source: jira:SCRUM-7 (snapshot in sources.doc)
  - id: AC-6
    text: "One code per order. Applying a second code replaces the first."
    source: jira:SCRUM-7 (snapshot in sources.doc)
  - id: AC-7
    text: "The customer can remove the applied code, and the total goes back to the original."
    source: jira:SCRUM-7 (snapshot in sources.doc)
launch_codes:   # test data, copied from the ticket's "Launch codes" table
  - { code: SAVE10, discount: "10%", minimum_order: "3,000 AMD", status: valid }
  - { code: TREAT15, discount: "15%", minimum_order: "8,000 AMD", status: valid }
  - { code: OLD15, discount: "15%", minimum_order: "none", status: expired }
out_of_scope:
  - "Free-delivery codes"
  - "Chef-specific codes"
  - "First-order-only codes"
questions:
  - id: Q-1
    about: [AC-2, AC-3]
    text: "AC-2 says \"A valid code reduces the subtotal by the code's percentage\" and then shows \"the new total\". If checkout has a delivery fee, is the percentage taken from the items subtotal only, or from the total including delivery? And is the minimum in AC-3 (\"the subtotal is at least the code's minimum order amount\") checked against the items subtotal?"
    options:
      - "Discount and minimum both use the items subtotal only; delivery is added after the discount"
      - "Discount applies to the whole total including delivery; minimum uses the items subtotal"
      - "Both discount and minimum use the total including delivery"
    answer: "Items subtotal only: discount and minimum both use the items subtotal; delivery is added after the discount"
    answered_by: "Hakob Julfayan"
  - id: Q-2
    about: [AC-2]
    text: "AC-2: \"reduces the subtotal by the code's percentage\". The ticket never says how a fractional discount is rounded (e.g. 15% of 8,010 AMD = 1,201.5 AMD). How should the discount be rounded?"
    options:
      - "Round to the nearest whole AMD (half up)"
      - "Round the discount down (customer gets the smaller discount)"
      - "Keep decimals (show 1,201.50 AMD)"
    answer: "Nearest whole AMD: round half up to a whole AMD"
    answered_by: "Hakob Julfayan"
  - id: Q-3
    about: [AC-3, AC-7]
    text: "AC-3 says \"A code works only if the subtotal is at least the code's minimum order amount\", but nothing says what happens to an already-applied code when the cart changes. If SAVE10 is applied and the customer then lowers the cart below 3,000 AMD, what should happen?"
    options:
      - "The code stays attached, the discount is dropped and the \"Add {missing amount} AMD more…\" message shows"
      - "The code is removed automatically and the total goes back to the original"
      - "The discount stays until the order is placed (no re-check)"
    answer: "Keep code, drop discount: code stays attached, discount removed, \"Add {missing amount} AMD more…\" message shown"
    answered_by: "Hakob Julfayan"
  - id: Q-4
    about: [AC-6]
    text: "AC-6: \"Applying a second code replaces the first.\" If the second code is invalid (unknown, expired, or below its minimum), does it still replace the first one?"
    options:
      - "No: the first code stays applied and the error for the second code is shown"
      - "Yes: the first code is removed and only the error is shown"
    answer: "No, first stays: first code stays applied; the error for the second code is shown"
    answered_by: "Hakob Julfayan"
  - id: Q-5
    about: [AC-1, AC-5]
    text: "AC-5: \"An unknown code shows \\\"Code not found\\\"\". The ticket lists codes in upper case (SAVE10) but doesn't say whether input like \"save10\" or \" SAVE10 \" (spaces) is accepted or treated as unknown."
    options:
      - "Case-insensitive and surrounding spaces trimmed (\"save10\" works)"
      - "Exact match only (\"save10\" shows \"Code not found\")"
      - "Spaces trimmed but case must match"
    answer: "Case-insensitive + trim: \"save10\" and \" SAVE10 \" both work"
    answered_by: "Hakob Julfayan"
  - id: Q-6
    about: [AC-3]
    text: "AC-3 message: \"Add {missing amount} AMD more to use this code\". How should {missing amount} be formatted, e.g. for a 2,500 AMD subtotal with SAVE10?"
    options:
      - "With a thousands separator: \"Add 500 AMD more…\" / \"Add 1,500 AMD more…\""
      - "Plain number, no separator: \"Add 1500 AMD more…\""
      - "Whatever format the rest of the checkout page uses for prices"
    answer: "Thousands separator: \"Add 1,500 AMD more to use this code\""
    answered_by: "Hakob Julfayan"
  - id: Q-7
    about: [AC-1]
    text: "AC-1: \"the customer can enter a promo code and press Apply\". What should happen when Apply is pressed with an empty field?"
    options:
      - "Apply is disabled while the field is empty"
      - "A validation message is shown (e.g. \"Enter a code\")"
      - "Treated as unknown: \"Code not found\""
    answer: "Apply disabled: Apply can't be pressed while the field is empty"
    answered_by: "Hakob Julfayan"
  - id: Q-8
    about: [AC-2]
    text: "AC-2 only says \"The discount and the new total are shown before the order is placed.\" It doesn't say the discount is kept on the placed order. Should the placed order (order confirmation / order history) be charged and show the discounted total?"
    options:
      - "Yes: the placed order total equals the discounted total shown at checkout"
      - "Out of scope: only the checkout page display is tested"
    answer: "Yes, order keeps discount: placed order total equals the discounted total shown at checkout"
    answered_by: "Hakob Julfayan"
