candidates:
  - id: H-1
    title: "Backend promo quote applies the percent to subtotal + delivery price"
    layer: backend
    mechanism: "The storefront sends subtotal 3000 and deliveryMethod DELIVERY to POST /api/customer/promo/apply (O-01-4). OrderService.applyPromo gets the delivery price for that method (500) and passes it to PromoService.quote (O-08-3), which sets fullTotal = subtotal + deliveryPrice (O-08-1) and discount = round(fullTotal × percent / 100) (O-08-2). The response is discount 350.0, deliveryPrice 500.0, total 3150.0 (O-01-5, O-03-3), logged as 'promo.applied code=SAVE10 status=APPLIED discount=350.0' (O-03-2). The checkout shows the server's discount and computes Total = subtotal − discount + delivery = 3,150 (O-08-12, O-08-13). Order placement calls the same quote method with the delivery price and stores subtotal − discount + delivery (O-08-9, O-08-10), which matches order FM-100002 at 3,150 AMD (problem.yaml observed)."
    root_cause: "PromoService.quote (apps/backend/src/main/java/am/foodme/backend/service/PromoService.java:30 and :48 at ff70db0) computes the discount as percent × (subtotal + deliveryPrice) instead of percent × items subtotal. It is used both by POST /api/customer/promo/apply (OrderService.applyPromo) and by order placement (OrderService.createOrder), so the checkout and the placed order both get the inflated discount."
