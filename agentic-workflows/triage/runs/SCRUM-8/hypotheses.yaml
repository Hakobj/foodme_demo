explained_side_observations:
  - "O-03-4 / O-04-2 (brief 03 and 04 show one promo apply through 10:52:30Z) vs O-06-8 (three applies at 10:50-10:51Z): judge-01 A1. Re-queried at 10:56Z, the backend telemetry shows all three: Loki has promo.applied discount=300.0 at 10:50:25Z, 350.0 at 10:50:43Z and 450.0 at 10:51:31Z with matching request/response bodies (O-09-1..O-09-6, 4 promo/apply HTTP lines in total, O-09-7), and the Prometheus promo-apply counter goes 1 to 4 between 10:50:00Z and 10:52:00Z (O-10-1, O-10-2), delivery-price 1 to 5 (O-10-3). Briefs 03 and 04 were queried before brief 06 ran (they returned before brief 06 was written), so their windows held only the 10:45:18Z apply."
  - "O-01-7 / O-01-8 / O-03-4 / O-04-2: the second apply at ~10:45:37Z showed the same values but sent no request. The storefront's promo query key is [promo, code, chefId, subtotal, deliveryMethod] with a 30 s staleTime and Remove only clears the code (O-08-15, O-08-16), so re-applying the same code on the same cart within 30 s reuses the cached response (code reading, not run). In brief 06 the applies changed the delivery method or subtotal and each sent a request (O-06-8). Not related to the discount base."
  - "O-02-*, O-05-*: GlitchTip events in the windows are the demo heartbeat jobs and storefront background-task errors, none on the promo or order requests. BACKEND-6 (POST /api/order not-null violation, env 'local', 11:43:50Z) is a different problem."
