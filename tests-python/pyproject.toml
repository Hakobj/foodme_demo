# Lint / type-check config for the Python test suite. pytest config stays in pytest.ini.

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv", "test-results"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "PT",       # pytest style
    "RET",      # return statements
    "C4",       # comprehensions
    "PIE",
    "PLE", "PLW",
]

[tool.ruff.lint.isort]
known-first-party = ["clients", "pages", "support"]

[tool.mypy]
python_version = "3.10"
files = ["clients", "pages", "support", "tests", "conftest.py"]
exclude = ["\\.venv/", "test-results/"]
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
