[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --import-mode=importlib
markers =
    api: HTTP tests against the running backend (port of the JUnit/MockMvc suite)
    web: Playwright UI tests for the storefront (port of apps/web/e2e)
    admin: Playwright UI tests for the back office (port of apps/admin/e2e)
